# Configuración versionada de gitleaks (threat model §5 — Secretos/cadena).
#
# Antes el scan corría con la config por defecto SIN archivo en el repo: las
# excepciones (cuando llegaran) habrían terminado como flags ad-hoc en CI o
# supresiones invisibles. Con el archivo versionado, toda excepción pasa por
# code review y queda auditable en el historial.
#
# REGLAS del allowlist (gobernanza §2):
#  - Cada entrada lleva comentario con el porqué y el alcance más estrecho
#    posible: regex ANCLADO tipo '''(?:^|/)archivo\.ext$''' (gitleaks casa por
#    SUBSTRING — un patrón sin anclar exime cualquier path que lo contenga) y,
#    cuando aplique, acotado a reglas concretas — jamás una regla global.
#  - Prohibido allowlistear credenciales "de verdad" aunque estén rotadas:
#    una credencial filtrada se rota Y se reescribe/invalida, no se acepta.
#  - Los lockfiles (pnpm-lock.yaml incluido) YA los exime el allowlist por
#    defecto de gitleaks (heredado abajo) — no repetirlos aquí.
#  - Los secretos de DESARROLLO deliberados del repo (p. ej. passwords de
#    docker-compose local, DEV_*_KEY_HEX con guard de entorno AUD-P2-008) no
#    disparan las reglas por defecto hoy; si una regla futura los detecta, la
#    excepción se añade AQUÍ, acotada, con justificación — no silenciando CI.
#
# DIVISIÓN DE MECANISMOS (gobernanza, F6.5C3):
#  - Este archivo (`.gitleaks.toml`) conserva las allowlists FUNCIONALES por
#    regla/path/regex cuando sean objetivamente necesarias (clases enteras de
#    contenido, siempre con el alcance más estrecho posible).
#  - Un finding HISTÓRICO INDIVIDUAL (p. ej. un fixture sintético de test que
#    ya vive en un commit inmutable del rango del PR) se ignora ÚNICAMENTE por
#    su fingerprint EXACTO `commit:path:regla:línea` en `.gitleaksignore` —
#    nunca aquí. Cada fingerprint exige comentario/justificación en el PR que
#    lo introduce.
#  - PROHIBIDO allowlistear commits completos, paths completos o reglas
#    enteras (p. ej. generic-api-key) para resolver un fixture individual: el
#    fingerprint exacto es el único mecanismo autorizado para ese caso.

[extend]
# Hereda TODAS las reglas y el allowlist por defecto de gitleaks; este
# archivo solo ACOTA (añadir excepciones), jamás relaja reglas.
useDefault = true

[allowlist]
description = "Excepciones revisables de Fluvia (vacío = ninguna excepción vigente)"
paths = []
