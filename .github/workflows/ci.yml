name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, migraciones y tests (PG real)
    runs-on: ubuntu-latest
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fluvia
      APP_DATABASE_URL: postgres://fluvia_app:fluvia_app_dev_password@127.0.0.1:5432/fluvia
      WORKER_DATABASE_URL: postgres://fluvia_worker:fluvia_worker_dev_password@127.0.0.1:5432/fluvia
      RELAY_DATABASE_URL: postgres://fluvia_relay:fluvia_relay_dev_password@127.0.0.1:5432/fluvia
      INBOX_DATABASE_URL: postgres://fluvia_inbox:fluvia_inbox_dev_password@127.0.0.1:5432/fluvia
      AUTH_DATABASE_URL: postgres://fluvia_auth:fluvia_auth_dev_password@127.0.0.1:5432/fluvia
      # TM-03: los tests del rate limiter COMPARTIDO corren contra Redis real.
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluvia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (reproducible)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm build

      - name: Migraciones (validación contra PG real)
        run: pnpm migrate

      - name: Migraciones (segunda corrida debe ser no-op — idempotencia)
        run: |
          out=$(pnpm --filter @fluvia/db run migrate)
          echo "$out"
          echo "$out" | grep -q "nothing applied"

      - name: Tests (unit + integración con PostgreSQL real)
        run: pnpm test

      - name: Invariantes del ledger — SQL externo al ORM (F2-06, Gate Ledger)
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-ledger-invariants.sql

      - name: Worker-down drill — Gate Restore/resiliencia (F6, TM-04)
        # Ensaya el runbook «worker caído» sobre PG16 real (roles de mínimo
        # privilegio): reinicio (checkReady) -> el relay del outbox y el processor
        # del inbox DRENAN su backlog solos -> el drift watcher DETECTA el drift
        # acumulado -> reparación EXPLÍCITA (rebuildProjection) deja el watcher
        # limpio. Solo Postgres (sin Redis). Corre tras la suite sobre la BD poblada
        # (drenado dirigido por objetivo, robusto al backlog heredado) y deja la BD
        # consistente para el restore drill.
        run: pnpm --filter @fluvia/api run drill:worker-down

      - name: Asegurar pg_dump 16+ (para el restore drill)
        run: |
          major=$(pg_dump --version | awk '{print $NF}' | cut -d. -f1)
          echo "pg_dump major=$major"
          if [ "$major" -lt 16 ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
          pg_dump --version

      - name: Restore drill — Gate Restore (F6, TM-04)
        # Ensaya el runbook de recuperación de desastre sobre PG16 real:
        # pg_dump -Fc -> pg_restore --exit-on-error en base fresca -> invariantes +
        # paridad (checksums row-level) sobre la copia -> drift detectado + rebuild
        # -> RLS preservado. Corre tras la suite (BD poblada, como una copia real).
        run: pnpm --filter @fluvia/api run drill:restore

      - name: Load-chaos drill — resiliencia bajo carga + fallo (F6, load-soak-chaos)
        # Ataca las redes de seguridad de V2-R1 (pool acotado + cotas de tiempo por
        # tx + reintento) inyectando fallo sobre PG16 real: saturación de pool
        # (concurrencia >> max), kill de backends fluvia_app EN VUELO
        # (pg_terminate_backend) e idempotencia bajo caos. Prueba que la INTEGRIDAD
        # del dinero (conservación + proyección == recomputo, cero drift ni asiento
        # huérfano) sobrevive al fallo abrupto. Corre el ÚLTIMO (es el más
        # destructivo: mata conexiones). Encontró un crash real — sin handler de
        # 'error' en el pool, una caída de conexión tumbaba el proceso.
        run: pnpm --filter @fluvia/api run drill:load-chaos

  security:
    name: Secret scanning, dependencias y SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Version del binario EXPLICITA (la config vive en .gitleaks.toml): la
          # action ya va pineada por SHA de commit, pero DESCARGA un binario de
          # gitleaks aparte; sin esto la version del escaner podria cambiar bajo
          # ese SHA. Dependabot mantiene ambos (el SHA de la action y este pin).
          GITLEAKS_VERSION: 8.24.3

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (reproducible)
        run: pnpm install --frozen-lockfile

      # El registro npm retiró (HTTP 410) los endpoints legacy de audit que usa
      # pnpm 10 (/-/npm/v1/security/audits/quick y /-/npm/v1/security/audits);
      # pnpm 11 consulta el bulk advisory endpoint activo
      # (/-/npm/v1/security/advisories/bulk). Se ejecuta pnpm 11 en versión
      # EXACTA y aislada vía npm exec (reproducibilidad) SOLO para el audit; la
      # instalación del proyecto sigue en pnpm 10.33.0 (packageManager).
      # --pm-on-fail=ignore evita que pnpm 11 delegue en el pnpm 10.33.0 fijado
      # por packageManager (volvería a los endpoints retirados). El gate no
      # cambia: exit != 0 ante vulnerabilidades High/Critical.
      - name: Dependency audit (falla en High/Critical — Gate Seguridad)
        run: npm exec --yes --package=pnpm@11.13.0 -- pnpm --pm-on-fail=ignore audit --audit-level high

      - name: Licencias transitivas (política RA-F6-004, modo estricto)
        # Gate de docs/compliance/license-policy.md en --strict: falla ante
        # licencia PROHIBIDA o DESCONOCIDA en producción Y ante RESTRINGIDA sin
        # decisión humana registrada en license-exceptions.json (las 2 actuales
        # fueron decididas por el propietario el 2026-07-10 — la aceptación NO
        # autoriza producción; la LGPL exige revisión legal antes del primer
        # release). Reproducible: `pnpm licenses:check --strict`.
        run: pnpm licenses:check --strict

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: fluvia-sbom.spdx.json

      # F6 (threat model §5 — Secretos/cadena): el SBOM se generaba pero nadie
      # lo LEÍA (capacidad simulada). Grype escanea el mismo árbol y ROMPE el
      # build ante High/Critical no aceptadas explícitamente en `.grype.yaml`
      # (el registro de aceptación versionado — proceso en
      # docs/security/vulnerability-acceptance.md). Complementa `pnpm audit`
      # (otra base de datos, otro matcher: defensa en profundidad).
      - name: Escaneo de vulnerabilidades (grype — falla en High/Critical no aceptadas)
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          output-format: table

  e2e:
    # E2E de navegador del justificante del POS: dashboard REAL (`next build` +
    # `next start`) contra la API SINTÉTICA versionada (apps/dashboard/e2e/
    # synthetic-api.mjs). 390/768/1440 px, teclado, impresión (pie de página
    # leído del PDF real de Chromium) y >100 devoluciones. La verificación
    # contra PG/Redis/API/MockProvider reales es local: apps/dashboard/e2e/real-stack/.
    name: E2E navegador (justificante del POS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (reproducible)
        run: pnpm install --frozen-lockfile

      - name: Chromium de Playwright (versión del lockfile)
        run: pnpm --filter @fluvia/dashboard exec playwright install --with-deps chromium

      - name: Build del dashboard (next build)
        run: pnpm --filter @fluvia/dashboard exec next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: E2E del justificante
        run: pnpm --filter @fluvia/dashboard e2e
        env:
          CI: 'true'

  e2e-assistant:
    # Asistente «Fluvia» de punta a punta con proveedores DETERMINISTAS y sin
    # secretos externos: PG, Redis, API y panel reales; servidor LiveKit REAL
    # en contenedor (solo 127.0.0.1, claves de desarrollo de este job);
    # agente de voz de PRUEBA; Chromium con micrófono falso. Verifica
    # transporte WebRTC y audio en ambos sentidos, no la calidad de ningún
    # proveedor de IA (esos adaptadores tienen pruebas de contrato en `quality`).
    name: E2E asistente (WebRTC real, proveedores deterministas)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: local
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fluvia
      APP_DATABASE_URL: postgres://fluvia_app:fluvia_app_dev_password@127.0.0.1:5432/fluvia
      WORKER_DATABASE_URL: postgres://fluvia_worker:fluvia_worker_dev_password@127.0.0.1:5432/fluvia
      RELAY_DATABASE_URL: postgres://fluvia_relay:fluvia_relay_dev_password@127.0.0.1:5432/fluvia
      INBOX_DATABASE_URL: postgres://fluvia_inbox:fluvia_inbox_dev_password@127.0.0.1:5432/fluvia
      AUTH_DATABASE_URL: postgres://fluvia_auth:fluvia_auth_dev_password@127.0.0.1:5432/fluvia
      WEBHOOK_DATABASE_URL: postgres://fluvia_webhook:fluvia_webhook_dev_password@127.0.0.1:5432/fluvia
      REDIS_URL: redis://127.0.0.1:6379
      FLUVIA_PROGRAM_TENANT_ID: e744e6eb-95cf-5762-95a7-268a0917e747
      # Llamada: LiveKit local del job + agente de prueba. Claves SOLO de CI.
      ASSISTANT_CALL_PROVIDER: livekit
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_INTERNAL_URL: ws://127.0.0.1:7880
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: fluviaci
      LIVEKIT_API_SECRET: fluvia-ci-solo-pruebas-0123456789abcdef0123
      LIVEKIT_TEST_URL: ws://127.0.0.1:7880
      LIVEKIT_TEST_API_KEY: fluviaci
      LIVEKIT_TEST_API_SECRET: fluvia-ci-solo-pruebas-0123456789abcdef0123
      ASSISTANT_AGENT_URL: http://127.0.0.1:3346
      ASSISTANT_AGENT_SECRET: agente-ci-solo-pruebas-0123456789abcdef
      AGENT_CONTROL_SECRET: agente-ci-solo-pruebas-0123456789abcdef
      AGENT_HOST: 127.0.0.1
      AGENT_PORT: '3346'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluvia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (reproducible)
        run: pnpm install --frozen-lockfile

      - name: Migraciones y seed de demo (sintético)
        run: pnpm migrate && pnpm seed

      - name: Servidor LiveKit (contenedor, solo 127.0.0.1)
        run: |
          cat >"$RUNNER_TEMP/livekit.yaml" <<EOF
          port: 7880
          bind_addresses: ['127.0.0.1']
          rtc:
            tcp_port: 7881
            udp_port: 7882
            use_external_ip: false
            node_ip: 127.0.0.1
          keys:
            $LIVEKIT_API_KEY: $LIVEKIT_API_SECRET
          room:
            empty_timeout: 60
            max_participants: 4
          EOF
          docker run -d --name livekit --network host \
            -v "$RUNNER_TEMP/livekit.yaml:/etc/livekit.yaml:ro" \
            livekit/livekit-server:v1.13.7 --config /etc/livekit.yaml
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:7880 >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7880

      - name: Agente de voz — WebRTC real con cliente rtc-node (prueba y contrato de voz)
        run: pnpm --filter @fluvia/voice-agent test

      - name: Chromium de Playwright (versión del lockfile)
        run: pnpm --filter @fluvia/dashboard exec playwright install --with-deps chromium

      - name: Build del dashboard (CSP con LiveKit, ganchos E2E de reconexión)
        run: pnpm --filter @fluvia/dashboard exec next build
        env:
          NEXT_PUBLIC_FLUVIA_E2E_HOOKS: '1'

      - name: Arrancar API, agente de voz y dashboard
        run: |
          L="$RUNNER_TEMP/logs"; mkdir -p "$L" "$RUNNER_TEMP/assistant"
          (cd apps/api && FX_REFRESH=off HOST=127.0.0.1 PORT=3340 CHECKOUT_BASE_URL=http://127.0.0.1:3341 \
            ASSISTANT_STORAGE_DIR="$RUNNER_TEMP/assistant" nohup node --import tsx src/server.ts >"$L/api.log" 2>&1 &)
          (cd apps/voice-agent && nohup node --import tsx src/main.ts >"$L/agent.log" 2>&1 &)
          (cd apps/dashboard && FLUVIA_API_URL=http://127.0.0.1:3340 \
            FLUVIA_DASHBOARD_ORIGIN=http://127.0.0.1:3342 \
            nohup npx next start -H 127.0.0.1 -p 3342 >"$L/dashboard.log" 2>&1 &)
          for url in http://127.0.0.1:3340/health http://127.0.0.1:3346/health http://127.0.0.1:3342/login; do
            for _ in $(seq 1 90); do curl -sf -o /dev/null "$url" && break; sleep 1; done
            curl -sf -o /dev/null -w "$url %{http_code}\n" "$url"
          done

      - name: E2E del asistente (llamada WebRTC, presentación pública y chat)
        run: >-
          pnpm --filter @fluvia/dashboard exec playwright test
          -c e2e/real-stack/playwright.config.ts llamada-webrtc presentacion-asistente
        env:
          CI: 'true'
          DEMO_APP_URL: http://127.0.0.1:3342
          AGENT_HEALTH_URL: http://127.0.0.1:3346/health

      - name: Logs de los servicios (si falla)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/logs/*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done
          docker logs --tail 200 livekit || true

  e2e-restaurant:
    # Restaurante y cobro presencial de punta a punta: PG, API, panel y
    # checkout REALES (sin proveedores externos). Configuración por el dueño,
    # mesero (390) y cocina (tablet) en dispositivos distintos con corte de red
    # y reconexión del KDS, cuenta dividida pagada por el checkout y por el
    # SIMULADOR de cobro presencial (marcado como tal), comensal por QR,
    # independiente «Cobrar» y aislamiento entre organizaciones. Ninguna
    # lectura de tarjeta física: el terminal es el simulador de sandbox.
    name: E2E restaurante y cobro presencial (stack real)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: local
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fluvia
      APP_DATABASE_URL: postgres://fluvia_app:fluvia_app_dev_password@127.0.0.1:5432/fluvia
      WORKER_DATABASE_URL: postgres://fluvia_worker:fluvia_worker_dev_password@127.0.0.1:5432/fluvia
      RELAY_DATABASE_URL: postgres://fluvia_relay:fluvia_relay_dev_password@127.0.0.1:5432/fluvia
      INBOX_DATABASE_URL: postgres://fluvia_inbox:fluvia_inbox_dev_password@127.0.0.1:5432/fluvia
      AUTH_DATABASE_URL: postgres://fluvia_auth:fluvia_auth_dev_password@127.0.0.1:5432/fluvia
      WEBHOOK_DATABASE_URL: postgres://fluvia_webhook:fluvia_webhook_dev_password@127.0.0.1:5432/fluvia
      REDIS_URL: redis://127.0.0.1:6379
      FLUVIA_PROGRAM_TENANT_ID: e744e6eb-95cf-5762-95a7-268a0917e747
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluvia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (reproducible)
        run: pnpm install --frozen-lockfile

      - name: Migraciones y seed de demo (sintético)
        run: pnpm migrate && pnpm seed

      - name: Chromium de Playwright (versión del lockfile)
        run: pnpm --filter @fluvia/dashboard exec playwright install --with-deps chromium

      - name: Build del panel y del checkout
        run: |
          pnpm --filter @fluvia/dashboard exec next build
          pnpm --filter @fluvia/checkout exec next build

      - name: Arrancar API, checkout y panel
        run: |
          L="$RUNNER_TEMP/logs"; mkdir -p "$L"
          (cd apps/api && FX_REFRESH=off HOST=127.0.0.1 PORT=3340 CHECKOUT_BASE_URL=http://127.0.0.1:3341 \
            nohup node --import tsx src/server.ts >"$L/api.log" 2>&1 &)
          (cd apps/checkout && FLUVIA_API_URL=http://127.0.0.1:3340 \
            nohup npx next start -H 127.0.0.1 -p 3341 >"$L/checkout.log" 2>&1 &)
          (cd apps/dashboard && FLUVIA_API_URL=http://127.0.0.1:3340 \
            FLUVIA_DASHBOARD_ORIGIN=http://127.0.0.1:3342 \
            nohup npx next start -H 127.0.0.1 -p 3342 >"$L/dashboard.log" 2>&1 &)
          for url in http://127.0.0.1:3340/health http://127.0.0.1:3341/m/x http://127.0.0.1:3342/login; do
            for _ in $(seq 1 90); do curl -s -o /dev/null "$url" && break; sleep 1; done
            curl -s -o /dev/null -w "$url %{http_code}\n" "$url"
          done

      - name: E2E restaurante y cobro presencial
        run: >-
          pnpm --filter @fluvia/dashboard exec playwright test
          -c e2e/real-stack/playwright.config.ts restaurante-cobro
        env:
          CI: 'true'
          DEMO_APP_URL: http://127.0.0.1:3342
          API_URL: http://127.0.0.1:3340

      - name: Seed de Tiendas (sintético)
        run: pnpm --filter @fluvia/seeds run seed:tiendas

      - name: E2E Personal · Tiendas (compra, pago, comercio, aislamiento)
        run: >-
          pnpm --filter @fluvia/dashboard exec playwright test
          -c e2e/real-stack/playwright.config.ts tiendas-personal
        env:
          CI: 'true'
          DEMO_APP_URL: http://127.0.0.1:3342

      - name: E2E tasas de referencia y moneda de visualización (fixtures, sin red externa)
        run: >-
          pnpm --filter @fluvia/dashboard exec playwright test
          -c e2e/real-stack/playwright.config.ts tasas-moneda
        env:
          CI: 'true'
          DEMO_APP_URL: http://127.0.0.1:3342

      - name: Logs de los servicios (si falla)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/logs/*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done
