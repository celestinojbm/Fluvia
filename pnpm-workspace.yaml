packages:
  - 'packages/*'
  - 'apps/*'

# Overrides también aquí: pnpm >=11 ya no lee "pnpm.overrides" de package.json.
overrides:
  postcss@8.4.31: ^8.5.10
  # GHSA-5gmw-xhrv-c9v3 y relacionados (critical, RCE vía prototype pollution) — transitiva de vitest
  tinypool@<2.1.2: ^2.1.2
  # Transitivas (vitest/postcss) con advisories high — subir a versión parcheada
  source-map-js@<1.2.2: ^1.2.2
  # >=7.3.7 (no ^7.3.7): el selector también reescribe el rango de vitest (^6||^7||^8);
  # con ^7.3.7 excluía vite 8 (peer de @vitejs/plugin-react 6). Sigue vetando <7.3.7.
  vite@>=7 <7.3.7: '>=7.3.7'
